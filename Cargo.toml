[package]
name = "monarch-mcp"
version = "0.4.0"
edition = "2021"
description = "Monarch Money MCP server — an agentic budgeting companion (read + categorize only)"
authors = ["Mike Lane <mikelane@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mikelane/monarch-mcp"
homepage = "https://github.com/mikelane/monarch-mcp"
readme = "README.md"
keywords = ["mcp", "monarch", "finance", "budgeting"]
categories = ["command-line-utilities", "api-bindings"]

[[bin]]
name = "monarch-mcp"
path = "src/main.rs"

[lib]
name = "monarch_mcp"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rmcp = { version = "1.7.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
schemars = "1.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
toml = "1.1"
rpassword = "7"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"
temp-env = "0.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
