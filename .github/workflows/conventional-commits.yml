name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: conventional-commits-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege — no write access needed.
permissions:
  contents: read

jobs:
  pr-title:
    name: PR title is Conventional Commits
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # keep in sync with release-plz.toml commit_parsers
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            chore
            style
            ci
            build
            revert
          requireScope: false
          subjectPattern: ^.+$

  commits:
    name: All commits are Conventional Commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Validate commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # keep in sync with release-plz.toml commit_parsers
          PATTERN='^(feat|fix|perf|refactor|docs|test|chore|style|ci|build|revert)(\([a-z0-9._/-]+\))?!?: .+'

          # Capture subjects into a file first — a git log failure now aborts the job
          # rather than silently passing with an empty stream.
          subjects_file=$(mktemp)
          git log --no-merges --format=%s "$BASE_SHA".."$HEAD_SHA" > "$subjects_file"

          subject_count=$(grep -c . "$subjects_file" || true)
          if [ "$subject_count" -eq 0 ]; then
            echo "ERROR: No commits found in range $BASE_SHA..$HEAD_SHA — nothing to validate."
            exit 1
          fi

          violations=()
          while IFS= read -r subject; do
            if [ -z "$subject" ]; then
              continue
            fi
            if ! echo "$subject" | grep -qE "$PATTERN"; then
              violations+=("  - $subject")
            fi
          done < "$subjects_file"

          if [ ${#violations[@]} -gt 0 ]; then
            echo "ERROR: The following commit subjects do not follow Conventional Commits:"
            printf '%s\n' "${violations[@]}"
            echo ""
            echo "Expected format: <type>(<optional scope>)<optional !>: <description>"
            echo ""
            echo "Allowed types: feat | fix | perf | refactor | docs | test | chore | style | ci | build | revert"
            echo ""
            echo "Examples:"
            echo "  feat: add spending report"
            echo "  fix(client): handle 401 gracefully"
            echo "  refactor!: rename tool parameter"
            exit 1
          fi

          echo "All $subject_count commit subject(s) follow Conventional Commits."
