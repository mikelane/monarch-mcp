version: 2
updates:
  # Keep Cargo dependencies up to date
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies

  # Keep GitHub Actions up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    ignore:
      # release.yml is autogenerated by cargo-dist, which pins the artifact
      # action versions it emits. Hand-bumping them fails cargo-dist's
      # `dist plan` consistency check (closed #3 and #6 for exactly this).
      # Advance them by bumping cargo-dist (dist-workspace.toml) + `dist init`,
      # not via dependabot. These actions appear only in the generated file.
      - dependency-name: "actions/upload-artifact"
      - dependency-name: "actions/download-artifact"
